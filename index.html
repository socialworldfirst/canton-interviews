<style>
:root{--red:#FF0051;--plum:#13002D;--grey:#484F56;--black:#1F2323;--light:#ECEDEE;--white:#FFFFFF;--line:#DADCDD}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--light)}
body{font-family:Poppins,sans-serif;color:var(--black);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:32px 16px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
header img{height:24px}
header span{font-size:12px;color:var(--grey)}
h1{font-weight:800;font-size:32px;letter-spacing:-1px;color:var(--plum);line-height:1.1;margin-bottom:6px}
.lede{color:var(--grey);margin-bottom:28px}
.day{margin-bottom:28px}
.day h2{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.card{background:var(--white);border-top:4px solid var(--red);padding:18px 22px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.card .av{width:44px;height:44px;border-radius:50%;object-fit:cover;margin-right:12px;vertical-align:middle}
.card .n{font-weight:700;font-size:16px;color:var(--plum)}
.tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:600;color:var(--grey);border:1px solid var(--line);border-radius:999px;padding:1px 8px;vertical-align:middle}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns a{text-decoration:none;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1.5px solid var(--plum);color:var(--plum)}
.btns a.p{background:var(--plum);color:#fff}
.btns a:hover{border-color:var(--red);color:var(--red)}
.btns a.p:hover{background:var(--red);color:#fff}
.key{font-size:12px;color:var(--grey);margin-top:8px}
@media (max-width:600px){h1{font-size:26px}.card{flex-direction:column;align-items:flex-start}}
</style>
</head>
